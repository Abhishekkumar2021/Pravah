# Vault dev + PostgreSQL — after `docker compose up`, run ./vault/scripts/init-vault.sh from the host
# (or follow README manual vault CLI steps). Tests use Testcontainers and bootstrap Vault via HTTP.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    # Host 5432 is often taken (local Postgres, playground 03). Vault still uses postgres:5432 on the compose network.
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  vault:
    image: hashicorp/vault:1.15
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    # Token + bind address come from env (Vault 1.15+ removed `-dev-root-token` CLI flag).
    command: ["server", "-dev"]
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 2s
      timeout: 2s
      retries: 30
      start_period: 5s
