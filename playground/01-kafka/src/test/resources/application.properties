# Spring Kafka test wiring (see KafkaIntegrationTest javadoc).
# @EmbeddedKafka registers the in-process broker under spring.embedded.kafka.brokers.
# application.yml in src/main still has bootstrap-servers=localhost:9092 for Docker runs.
# This line overrides ONLY for tests so producers/consumers use the embedded broker.
spring.kafka.bootstrap-servers=${spring.embedded.kafka.brokers}
