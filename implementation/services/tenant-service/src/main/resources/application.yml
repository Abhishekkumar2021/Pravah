spring:
  application:
    name: tenant-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/pravah_tenant
    username: ${DB_USERNAME:pravah}
    password: ${DB_PASSWORD:pravah}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

server:
  port: 8082

# JWT Configuration (for local development only - use environment variables in production)
pravah:
  security:
    jwt:
      secret: ${JWT_SECRET:pravah-local-dev-secret-key-minimum-256-bits-for-hs256}
      expiration-ms: ${JWT_EXPIRATION_MS:86400000}
      refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# Logging configuration is in logback-spring.xml
# - Local profile: human-readable console logs
# - Production profile: JSON structured logs (via logstash-logback-encoder)
# MDC keys automatically added: tenant_id, user_id, request_id, trace_id, span_id
