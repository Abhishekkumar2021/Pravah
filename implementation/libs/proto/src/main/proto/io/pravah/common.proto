syntax = "proto3";

package io.pravah;

option java_package = "io.pravah.proto.common";
option java_outer_classname = "CommonProtos";
option java_multiple_files = true;

// Common message types shared across services

// Pagination request
message PageRequest {
  int32 page = 1;        // 0-indexed page number
  int32 size = 2;        // Page size (default: 20, max: 100)
  string sort_by = 3;    // Field to sort by
  bool descending = 4;   // Sort direction
}

// Pagination response metadata
message PageInfo {
  int32 page = 1;
  int32 size = 2;
  int64 total_elements = 3;
  int32 total_pages = 4;
  bool has_next = 5;
  bool has_previous = 6;
}

// Error details
message ErrorDetail {
  string code = 1;       // Machine-readable error code
  string message = 2;    // Human-readable message
  string field = 3;      // Field name for validation errors
  string trace_id = 4;   // Correlation ID for debugging
}

// Timestamp wrapper (protobuf Timestamp is preferred, but this adds context)
message AuditInfo {
  string created_by = 1;
  int64 created_at = 2;   // Unix epoch millis
  string updated_by = 3;
  int64 updated_at = 4;   // Unix epoch millis
}

// Label for filtering and grouping
message Label {
  string key = 1;
  string value = 2;
}
