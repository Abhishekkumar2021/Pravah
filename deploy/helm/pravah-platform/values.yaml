# Default values for pravah-platform.
# Production: use values-prod.yaml with external Postgres/Kafka/Redis and proper secrets.

global:
  imageRegistry: ""

nameOverride: ""
fullnameOverride: ""

image:
  registry: ghcr.io
  repositoryPrefix: abhishekkumar2021/pravah
  tag: latest
  pullPolicy: IfNotPresent
  pullSecrets: []

# External secrets integration (ExternalSecrets operator, Vault CSI, etc.)
externalSecrets:
  enabled: false
  secretName: ""

# Fail helm template when production values omit required secrets / hosts
requireProductionSecrets: false

# JVM defaults for all Spring Boot services (override per environment)
jvmOptions: "-XX:MaxRAMPercentage=75.0 -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError"

# Bundled PostgreSQL (disable in production; use externalPostgres instead)
postgres:
  enabled: true
  image: postgres:16-alpine
  auth:
    username: pravah
    password: pravah
    database: pravah
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70

# External PostgreSQL (when postgres.enabled=false)
externalPostgres:
  host: ""
  port: 5432
  username: ""
  password: ""
  existingSecret: ""
  existingSecretUsernameKey: postgres-username
  existingSecretPasswordKey: postgres-password
  databases:
    tenant-service: pravah_tenant
    pipeline-service: pravah_pipeline
    execution-service: pravah_execution
    scheduler-service: pravah_scheduler
    notification-service: pravah_notification
    connect-service: pravah_connect
    runner-service: pravah_runner

# Bundled Kafka (disable in production; use externalKafka instead)
kafka:
  enabled: true
  image: apache/kafka:3.7.0
  clusterId: pravah-kafka-cluster-001
  persistence:
    enabled: true
    size: 5Gi
    storageClass: ""
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi

# External Kafka (when kafka.enabled=false)
externalKafka:
  bootstrapServers: ""
  sasl:
    enabled: false
    mechanism: PLAIN
    username: ""
    password: ""
    existingSecret: ""
    existingSecretJaasKey: kafka-jaas-config

# Bundled Redis (disable in production; use externalRedis instead)
redis:
  enabled: true
  image: redis:7-alpine
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi

# External Redis (when redis.enabled=false)
externalRedis:
  host: ""
  port: 6379
  password: ""
  existingSecret: ""
  existingSecretPasswordKey: redis-password
  tls:
    enabled: false

# Bundled MinIO (S3-compatible artifact storage; disable in production — use externalArtifact)
minio:
  enabled: true
  image: minio/minio:RELEASE.2024-12-18T13-15-44Z
  auth:
    rootUser: pravah
    rootPassword: pravah123
  bucket: pravah-artifacts
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# External S3-compatible artifact store (when minio.enabled=false)
externalArtifact:
  endpoint: ""
  region: us-east-1
  accessKey: ""
  secretKey: ""
  bucket: pravah-artifacts
  existingSecret: ""
  existingSecretAccessKeyKey: artifact-access-key
  existingSecretSecretKeyKey: artifact-secret-key
  # AWS EKS IRSA — omit static keys; execution-service uses DefaultCredentialsProvider
  irsa:
    enabled: false

# SMTP for notification-service (password reset, alert emails)
smtp:
  host: ""
  port: 1025
  username: ""
  password: ""
  auth: "false"
  starttls: "false"
  existingSecret: ""
  existingSecretPasswordKey: smtp-password

# Bundled Mailhog for local SMTP testing (disable in production)
mailhog:
  enabled: false
  image: mailhog/mailhog:v1.0.1
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 100m
      memory: 128Mi

# Bundled Vault dev server (disable in production; use externalVault with Kubernetes auth)
vault:
  enabled: false
  image: hashicorp/vault:1.15.6
  devRootToken: dev-root-token
  progressDeadlineSeconds: 600
  probes:
    startup:
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 24
    readiness:
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 5
      failureThreshold: 6
    liveness:
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 6
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# External HashiCorp Vault (when vault.enabled=false; pipeline-service uses Kubernetes auth)
externalVault:
  address: ""
  kubernetesMountPath: kubernetes

# Wait for bundled dependencies before app containers start
dependencyWait:
  enabled: true
  image: busybox:1.36

# Pravah services configuration
services:
  tenant-service:
    enabled: true
    port: 8082
    database: pravah_tenant
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 768Mi
    needsKafka: true
    needsPostgres: true
    needsRedis: true
    extraEnv: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  pipeline-service:
    enabled: true
    port: 8083
    database: pravah_pipeline
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 768Mi
    needsKafka: true
    needsPostgres: true
    needsRedis: false
    needsVault: false
    vaultKubernetesRole: ""
    extraEnv: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  execution-service:
    enabled: true
    port: 8084
    database: pravah_execution
    replicaCount: 1
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "2"
        memory: 1Gi
    needsKafka: true
    needsPostgres: true
    needsRedis: true
    extraEnv:
      PRAVAH_CONTAINER_ENABLED: "false"
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  scheduler-service:
    enabled: true
    port: 8085
    database: pravah_scheduler
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    needsKafka: true
    needsPostgres: true
    needsRedis: true
    extraEnv: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  notification-service:
    enabled: true
    port: 8088
    database: pravah_notification
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 768Mi
    needsKafka: true
    needsPostgres: true
    needsRedis: false
    extraEnv: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  connect-service:
    enabled: true
    port: 8091
    database: pravah_connect
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 768Mi
    needsKafka: true
    needsPostgres: true
    needsRedis: false
    extraEnv: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

  runner-service:
    enabled: true
    port: 8086
    grpcPort: 9091
    database: pravah_runner
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 768Mi
    needsKafka: true
    needsPostgres: true
    needsRedis: true
    extraEnv: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}
    exposeGrpc:
      enabled: false
      type: LoadBalancer
      annotations: {}

  gateway:
    enabled: true
    port: 8080
    replicaCount: 1
    waitForTenantService: true
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi
    extraEnv: {}
    podAnnotations: {}
    nodeSelector: {}
    tolerations: []
    affinity: {}

# Runner gRPC TLS/mTLS (ADR-005/008) — mount server cert + optional client CA for mTLS
runnerGrpcTls:
  enabled: false
  existingSecret: ""
  mountPath: /etc/pravah/runner-grpc-tls
  certChainKey: tls.crt
  privateKeyKey: tls.key
  clientCaKey: ca.crt
  requireClientAuth: true

# cert-manager Certificate for runner-service gRPC server TLS (requires cert-manager installed)
certManager:
  runnerGrpc:
    enabled: false
    certificateName: ""
    secretName: pravah-runner-grpc-tls
    issuerKind: ClusterIssuer
    issuerName: ""
    commonName: ""
    duration: 2160h
    renewBefore: 720h
    dnsNames: []

# Vault PKI issuance for runner client mTLS certificates on registration (ADR-008)
runnerPki:
  enabled: false
  issuePath: pki/issue/runner
  ttl: 168h
  spiffeTrustDomain: pravah.local

# Vault Transit engine for tenant secret encryption at rest (ADR-007, pathway #8)
vaultTransit:
  enabled: false
  mountPath: transit

# Pravah application configuration
pravah:
  jwtIssuer: pravah-dev
  # Set via values-local.yaml for kind/minikube, or --set / existingSecret in production.
  internalServiceSecret: ""
  internalServiceExistingSecret: ""
  internalServiceExistingSecretKey: internal-service-secret
  jwtSigningKey: ""
  devTenantId: "11111111-1111-4111-8111-111111111111"
  registrationTenantId: "11111111-1111-4111-8111-111111111111"
  realtimeRedisEnabled: "true"
  wsAllowedOrigins: "http://localhost:5173,http://127.0.0.1:5173"
  frontendBaseUrl: "http://localhost:5173"
  # Public webhook base URL (scheduler trigger URLs); override in prod to ingress host.
  hooksBaseUrl: ""
  # Production hardening (override in values-prod.yaml)
  rateLimitFailOpen: "true"
  rateLimitEnabled: "true"
  authRefreshCookieSecure: "false"
  mailFrom: "noreply@localhost.pravah"
  runnerBootstrapSecret: ""
  runnerBootstrapExistingSecret: ""
  runnerBootstrapExistingSecretKey: runner-bootstrap-secret
  gatewayIpAllowlistEnabled: "false"
  gatewayIpAllowlistCidrs: ""

# Ingress configuration
ingress:
  enabled: false
  className: ""
  host: pravah.local
  annotations: {}
  tls: []

# Pod Disruption Budget
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# Horizontal Pod Autoscaler
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# Service Account
serviceAccount:
  create: true
  name: ""
  annotations: {}

# Default resources (can be overridden per-service)
resources:
  requests:
    cpu: 100m
    memory: 384Mi
  limits:
    cpu: "1"
    memory: 768Mi

# Pod security context (applied to all pods)
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

# Container security context (applied to all containers)
containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Health probes configuration
probes:
  startup:
    enabled: true
    initialDelaySeconds: 10
    periodSeconds: 5
    failureThreshold: 30
    timeoutSeconds: 3
  liveness:
    initialDelaySeconds: 90
    periodSeconds: 15
    failureThreshold: 3
    timeoutSeconds: 5
  readiness:
    initialDelaySeconds: 30
    periodSeconds: 10
    failureThreshold: 3
    timeoutSeconds: 5

# Deployment strategy
deploymentStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1

# Network policies
networkPolicy:
  enabled: false
  # Allow egress to external managed Postgres/Kafka/Redis/S3/SMTP (required in production)
  allowExternalEgress: false
  externalEgressPorts:
    - 5432
    - 9092
    - 6379
    - 443
    - 587
  # DNS pod labels vary by cluster (kube-dns vs coredns)
  dnsNamespaceSelector: {}
  dnsPodLabels:
    k8s-app: kube-dns

# Pod topology spread constraints
topologySpreadConstraints:
  enabled: false
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: ScheduleAnyway

# Metrics and observability
metrics:
  enabled: true
  serviceMonitor:
    enabled: false
    namespace: ""
    interval: 30s
    labels: {}

# OpenTelemetry tracing (pathway #11). Enable with values-observability.yaml overlay.
observability:
  tracing:
    enabled: false
    # OTLP HTTP endpoint (Jaeger collector or OTel Collector)
    endpoint: ""
    samplingProbability: "0.1"
