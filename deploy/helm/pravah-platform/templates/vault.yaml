{{- if .Values.vault.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "pravah.vault.hostname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pravah.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault
spec:
  type: ClusterIP
  ports:
    - port: 8200
      targetPort: api
      protocol: TCP
      name: api
  selector:
    app.kubernetes.io/component: vault
    {{- include "pravah.selectorLabels" . | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "pravah.fullname" . }}-vault
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pravah.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/component: vault
      {{- include "pravah.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: vault
        {{- include "pravah.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: vault
          image: {{ .Values.vault.image }}
          args:
            - server
            - -dev
            - -dev-root-token-id=$(VAULT_DEV_ROOT_TOKEN_ID)
            - -dev-listen-address=0.0.0.0:8200
          env:
            - name: VAULT_DEV_ROOT_TOKEN_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "pravah.secretName" . }}
                  key: vault-dev-root-token
            - name: VAULT_ADDR
              value: http://127.0.0.1:8200
          ports:
            - containerPort: 8200
              name: api
              protocol: TCP
          securityContext:
            capabilities:
              add:
                - IPC_LOCK
          readinessProbe:
            exec:
              command:
                - vault
                - status
                - -address=http://127.0.0.1:8200
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            exec:
              command:
                - vault
                - status
                - -address=http://127.0.0.1:8200
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.vault.resources | nindent 12 }}
{{- end }}
