{{- if .Values.pgbouncer.enabled }}
# Allow access to PgBouncer from platform services (and metrics scrape within namespace)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "pravah.fullname" . }}-pgbouncer
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pravah.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: pgbouncer
      {{- include "pravah.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "pravah.selectorLabels" . | nindent 14 }}
      ports:
        - port: {{ .Values.pgbouncer.port | default 6432 }}
          protocol: TCP
        {{- if .Values.pgbouncer.metrics.enabled }}
        - port: {{ .Values.pgbouncer.metrics.port }}
          protocol: TCP
        {{- end }}
{{- end }}
