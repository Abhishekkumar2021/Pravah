{{- if and .Values.vault.enabled .Values.vaultTransit.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pravah.fullname" . }}-vault-transit-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pravah.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault-transit-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "4"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: vault-transit-init
        {{- include "pravah.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: vault-transit-init
          image: {{ .Values.vault.image }}
          env:
            - name: VAULT_ADDR
              value: http://{{ include "pravah.vault.hostname" . }}:8200
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pravah.secretName" . }}
                  key: vault-dev-root-token
            - name: TRANSIT_MOUNT
              value: {{ .Values.vaultTransit.mountPath | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              set -euo pipefail
              for i in $(seq 1 60); do
                vault status >/dev/null 2>&1 && break
                sleep 2
              done
              vault secrets enable -path="${TRANSIT_MOUNT}" transit 2>/dev/null || true
              echo "Vault Transit engine ready at ${TRANSIT_MOUNT}/"
{{- end }}
