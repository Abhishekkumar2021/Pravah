{{- if and .Values.vault.enabled .Values.runnerPki.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "pravah.fullname" . }}-vault-pki-init
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pravah.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault-pki-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/component: vault-pki-init
        {{- include "pravah.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: vault-pki-init
          image: {{ .Values.vault.image }}
          env:
            - name: VAULT_ADDR
              value: http://{{ include "pravah.vault.hostname" . }}:8200
            - name: VAULT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "pravah.secretName" . }}
                  key: vault-dev-root-token
            - name: SPIFFE_TRUST_DOMAIN
              value: {{ .Values.runnerPki.spiffeTrustDomain | quote }}
            - name: PKI_TTL
              value: {{ .Values.runnerPki.ttl | quote }}
          command:
            - /bin/sh
            - -ec
            - |
              set -euo pipefail
              for i in $(seq 1 60); do
                vault status >/dev/null 2>&1 && break
                sleep 2
              done
              vault secrets enable -path=pki pki 2>/dev/null || true
              vault secrets tune -max-lease-ttl=87600h pki >/dev/null
              if ! vault read -field=certificate pki/cert/ca >/dev/null 2>&1; then
                vault write -field=certificate pki/root/generate/internal \
                  common_name="Pravah Runner PKI Root" ttl=87600h >/dev/null
              fi
              vault write pki/roles/runner \
                allowed_uri_sans="spiffe://${SPIFFE_TRUST_DOMAIN}/tenant/*,spiffe://${SPIFFE_TRUST_DOMAIN}/runner/*" \
                allow_any_name=true allow_subdomains=true key_type=rsa key_bits=4096 \
                ttl="${PKI_TTL}" max_ttl="${PKI_TTL}" require_cn=false \
                use_csr_sans=true use_csr_common_name=true
              echo "Vault PKI runner role ready"
{{- end }}
