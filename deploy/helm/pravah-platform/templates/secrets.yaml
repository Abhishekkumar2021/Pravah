{{- if not .Values.externalSecrets.enabled }}
{{- $includePostgres := and .Values.postgres.enabled (not .Values.externalPostgres.existingSecret) }}
{{- $includePostgresFromValues := and (not .Values.postgres.enabled) (not .Values.externalPostgres.existingSecret) (or .Values.externalPostgres.username .Values.externalPostgres.password) }}
{{- $includeInternal := not .Values.pravah.internalServiceExistingSecret }}
{{- $includeMinio := and .Values.minio.enabled (not .Values.externalArtifact.existingSecret) }}
{{- $includeSmtp := and .Values.smtp.password (not .Values.smtp.existingSecret) }}
{{- $includeArtifactExternal := and (not .Values.minio.enabled) (not .Values.externalArtifact.existingSecret) (or .Values.externalArtifact.accessKey .Values.externalArtifact.secretKey) }}
{{- $includeRunnerBootstrap := and (not .Values.pravah.runnerBootstrapExistingSecret) .Values.pravah.runnerBootstrapSecret }}
{{- $includeVaultDev := and .Values.vault.enabled (not .Values.externalVault.existingSecret) }}
{{- if or $includePostgres $includePostgresFromValues $includeInternal .Values.pravah.jwtSigningKey $includeMinio $includeSmtp $includeArtifactExternal $includeRunnerBootstrap $includeVaultDev }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pravah.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pravah.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $includePostgres }}
  postgres-username: {{ .Values.postgres.auth.username | quote }}
  postgres-password: {{ .Values.postgres.auth.password | quote }}
  {{- else if $includePostgresFromValues }}
  postgres-username: {{ .Values.externalPostgres.username | quote }}
  postgres-password: {{ .Values.externalPostgres.password | quote }}
  {{- end }}
  {{- if $includeInternal }}
  internal-service-secret: {{ required "pravah.internalServiceSecret is required when not using pravah.internalServiceExistingSecret" .Values.pravah.internalServiceSecret | quote }}
  {{- end }}
  {{- if .Values.pravah.jwtSigningKey }}
  jwt-signing-key: {{ .Values.pravah.jwtSigningKey | quote }}
  {{- end }}
  {{- if $includeMinio }}
  minio-access-key: {{ .Values.minio.auth.rootUser | quote }}
  minio-secret-key: {{ .Values.minio.auth.rootPassword | quote }}
  {{- end }}
  {{- if $includeSmtp }}
  smtp-password: {{ .Values.smtp.password | quote }}
  {{- end }}
  {{- if $includeArtifactExternal }}
  artifact-access-key: {{ .Values.externalArtifact.accessKey | quote }}
  artifact-secret-key: {{ .Values.externalArtifact.secretKey | quote }}
  {{- end }}
  {{- if $includeRunnerBootstrap }}
  runner-bootstrap-secret: {{ .Values.pravah.runnerBootstrapSecret | quote }}
  {{- end }}
  {{- if $includeVaultDev }}
  vault-dev-root-token: {{ .Values.vault.devRootToken | quote }}
  {{- end }}
{{- end }}
{{- end }}
