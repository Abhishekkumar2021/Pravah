{{- if not .Values.externalSecrets.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pravah.fullname" . }}-credentials
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pravah.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.postgres.enabled }}
  postgres-username: {{ .Values.postgres.auth.username | quote }}
  postgres-password: {{ .Values.postgres.auth.password | quote }}
  {{- else if .Values.externalPostgres.existingSecret }}
  {{- /* External secret will be referenced directly */ -}}
  {{- else }}
  postgres-username: {{ .Values.externalPostgres.username | quote }}
  postgres-password: {{ .Values.externalPostgres.password | quote }}
  {{- end }}
  internal-service-secret: {{ .Values.pravah.internalServiceSecret | quote }}
  {{- if .Values.pravah.jwtSigningKey }}
  jwt-signing-key: {{ .Values.pravah.jwtSigningKey | quote }}
  {{- end }}
{{- end }}
