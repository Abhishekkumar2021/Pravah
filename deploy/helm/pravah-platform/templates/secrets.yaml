{{- if .Values.requireProductionSecrets }}
{{- if and (not .Values.pravah.internalServiceExistingSecret) (not .Values.pravah.internalServiceSecret) }}
{{- fail "pravah.internalServiceSecret must be set, or set pravah.internalServiceExistingSecret to an existing Secret name" }}
{{- end }}
{{- if and (not .Values.postgres.enabled) (not .Values.externalPostgres.host) (not .Values.externalPostgres.existingSecret) }}
{{- fail "externalPostgres.host or externalPostgres.existingSecret is required when postgres.enabled is false" }}
{{- end }}
{{- end }}
{{- if not .Values.externalSecrets.enabled }}
{{- $includePostgres := and .Values.postgres.enabled (not .Values.externalPostgres.existingSecret) }}
{{- $includePostgresFromValues := and (not .Values.postgres.enabled) (not .Values.externalPostgres.existingSecret) (or .Values.externalPostgres.username .Values.externalPostgres.password) }}
{{- $includeInternal := not .Values.pravah.internalServiceExistingSecret }}
{{- if or $includePostgres $includePostgresFromValues $includeInternal .Values.pravah.jwtSigningKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "pravah.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "pravah.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $includePostgres }}
  postgres-username: {{ .Values.postgres.auth.username | quote }}
  postgres-password: {{ .Values.postgres.auth.password | quote }}
  {{- else if $includePostgresFromValues }}
  postgres-username: {{ .Values.externalPostgres.username | quote }}
  postgres-password: {{ .Values.externalPostgres.password | quote }}
  {{- end }}
  {{- if $includeInternal }}
  internal-service-secret: {{ required "pravah.internalServiceSecret is required when not using pravah.internalServiceExistingSecret" .Values.pravah.internalServiceSecret | quote }}
  {{- end }}
  {{- if .Values.pravah.jwtSigningKey }}
  jwt-signing-key: {{ .Values.pravah.jwtSigningKey | quote }}
  {{- end }}
{{- end }}
{{- end }}
