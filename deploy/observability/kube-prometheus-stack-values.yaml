# kube-prometheus-stack values for Pravah (pathway #11).
# Install: scripts/deploy/k8s-local-observability.sh
#
# Scrapes ServiceMonitors labeled release=prometheus in namespace monitoring.

fullnameOverride: prometheus

defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: false
    kubeScheduler: false

alertmanager:
  enabled: true

grafana:
  enabled: true
  adminPassword: admin
  defaultDashboardsEnabled: true
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"
      searchNamespace: ALL
    datasources:
      enabled: true
      defaultDatasourceEnabled: true

prometheus:
  enabled: true
  prometheusSpec:
    retention: 7d
    serviceMonitorSelector:
      matchLabels:
        release: prometheus
    serviceMonitorNamespaceSelector:
      matchNames:
        - monitoring

prometheusOperator:
  enabled: true

kubeStateMetrics:
  enabled: true

nodeExporter:
  enabled: true

# kind/minikube: single-node clusters do not need control-plane scraping
kubeControllerManager:
  enabled: false
kubeEtcd:
  enabled: false
kubeProxy:
  enabled: false
kubeScheduler:
  enabled: false
