# kind cluster config for GitHub Actions k8s smoke (pathway #7).
# Single control-plane node; values-ci.yaml keeps JVM memory low.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: pravah-ci
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            max-pods: "220"
