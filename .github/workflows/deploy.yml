# Deploy: build and push container images to GHCR on main and on release.
name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy.yml"
  release:
    types: [published]

env:
  JAVA_VERSION: "21"
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/pravah

concurrency:
  group: deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  service-images:
    name: Deploy · Service images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - gateway
          - graphql
          - tenant-service
          - pipeline-service
          - execution-service
          - scheduler-service
          - runner-service
          - metadata-service
          - notification-service
          - agent-service
          - connect-service

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        working-directory: backend
        run: chmod +x gradlew

      - name: Build service JAR
        working-directory: backend
        run: ./gradlew :services:${{ matrix.service }}:bootJar --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/docker/Dockerfile.service
          build-args: |
            SERVICE_NAME=${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  runner:
    name: Deploy · Runner image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        working-directory: backend
        run: chmod +x gradlew

      - name: Build runner fat JAR
        working-directory: backend
        run: ./gradlew :runner:fatJar --no-daemon

      - name: Upload runner JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: pravah-runner
          path: backend/runner/build/libs/*-all.jar
          retention-days: 30

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (runner)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-runner
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push runner image
        uses: docker/build-push-action@v5
        with:
          context: backend
          file: backend/docker/Dockerfile.runner
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  gitops-image-tag:
    name: Deploy · GitOps image tag
    runs-on: ubuntu-latest
    needs: [service-images, runner]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Bump production image tag in values-prod
        env:
          SHA: ${{ github.sha }}
        run: |
          file=deploy/helm/pravah-platform/values-prod.yaml
          if grep -q '^  tag:' "$file"; then
            sed -i "s/^  tag: .*/  tag: \"${SHA}\"/" "$file"
          else
            echo "Could not find image.tag in ${file}" >&2
            exit 1
          fi
          grep '^  tag:' "$file"

      - name: Commit and push GitOps tag bump
        env:
          SHA: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/pravah-platform/values-prod.yaml
          if git diff --staged --quiet; then
            echo "image.tag already at ${SHA}"
            exit 0
          fi
          git commit -m "chore(deploy): Bump production image tag to ${SHA}"
          git push

  release-assets:
    name: Deploy · Release assets
    runs-on: ubuntu-latest
    needs: [service-images, runner]
    if: github.event_name == 'release'

    steps:
      - name: Download runner JAR
        uses: actions/download-artifact@v4
        with:
          name: pravah-runner

      - name: Attach runner JAR to GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            *-all.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
