name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

env:
  JAVA_VERSION: '21'

jobs:
  # ============================================================================
  # PR Title and Commit Message Check
  # ============================================================================
  pr-lint:
    name: PR Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          subjectPattern: ^[A-Z].+$
          subjectPatternError: |
            The subject "{subject}" must start with an uppercase letter.

  # ============================================================================
  # Changed Files Analysis
  # ============================================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      implementation: ${{ steps.filter.outputs.implementation }}
      docs: ${{ steps.filter.outputs.docs }}
      workflows: ${{ steps.filter.outputs.workflows }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            implementation:
              - 'implementation/**'
            docs:
              - 'docs/**'
              - '*.md'
            workflows:
              - '.github/workflows/**'
            web:
              - 'web/**'

  # ============================================================================
  # Build Check (only if implementation changed)
  # ============================================================================
  build-check:
    name: Build Check
    needs: changes
    if: needs.changes.outputs.implementation == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementation

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Check for uncommitted changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "::error::Uncommitted changes detected after build"
            git status --porcelain
            exit 1
          fi

  # ============================================================================
  # Web UI (only if web/ changed)
  # ============================================================================
  web-check:
    name: Web Check
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # ============================================================================
  # Documentation Check
  # ============================================================================
  docs-check:
    name: Documentation Check
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Check for broken links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress 'docs/**/*.md' 'README.md'
          fail: false

  # ============================================================================
  # PR Size Check
  # ============================================================================
  pr-size:
    name: PR Size
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          ADDITIONS=$(gh pr view ${{ github.event.pull_request.number }} --json additions -q '.additions')
          DELETIONS=$(gh pr view ${{ github.event.pull_request.number }} --json deletions -q '.deletions')
          TITLE=$(gh pr view ${{ github.event.pull_request.number }} --json title -q '.title')
          TOTAL=$((ADDITIONS + DELETIONS))
          
          echo "PR has $ADDITIONS additions and $DELETIONS deletions ($TOTAL total)"
          
          # Skip size check for CI/infrastructure PRs (they're naturally larger)
          if [[ "$TITLE" =~ ^ci: ]] || [[ "$TITLE" =~ ^build: ]] || [[ "$TITLE" =~ ^chore: ]]; then
            echo "::notice::Skipping size check for infrastructure PR"
            exit 0
          fi
          
          if [ $TOTAL -gt 1000 ]; then
            echo "::warning::Large PR detected ($TOTAL lines). Consider breaking into smaller PRs."
          fi
          
          if [ $TOTAL -gt 2000 ]; then
            echo "::error::Very large PR ($TOTAL lines). Please break into smaller PRs."
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
