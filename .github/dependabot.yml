version: 2

updates:
  # ============================================================================
  # Gradle Dependencies
  # ============================================================================
  - package-ecosystem: "gradle"
    directory: "/implementation"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "java"
    commit-message:
      prefix: "deps(gradle)"
    ignore:
      # Stay on Spring Boot 3.x - don't upgrade to 4.x yet
      - dependency-name: "org.springframework.boot"
        update-types: ["version-update:semver-major"]
      - dependency-name: "org.springframework.cloud:spring-cloud-starter-gateway"
        update-types: ["version-update:semver-major"]
      # Stay on HikariCP 5.x
      - dependency-name: "com.zaxxer:HikariCP"
        update-types: ["version-update:semver-major"]
      # Stay on OkHttp 4.x
      - dependency-name: "com.squareup.okhttp3:okhttp"
        update-types: ["version-update:semver-major"]
    groups:
      spring:
        patterns:
          - "org.springframework*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "org.junit*"
          - "org.assertj*"
          - "org.mockito*"
          - "org.testcontainers*"
      grpc:
        patterns:
          - "io.grpc*"
          - "com.google.protobuf*"

  # ============================================================================
  # GitHub Actions
  # ============================================================================
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "deps(actions)"

  # ============================================================================
  # Docker Base Images
  # ============================================================================
  - package-ecosystem: "docker"
    directory: "/implementation/docker"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "deps(docker)"
    ignore:
      # Stay on Java 21 - don't upgrade to newer JDK versions
      - dependency-name: "eclipse-temurin"
        update-types: ["version-update:semver-major"]
