[versions]
# Java (LTS)
java = "21"

# Spring — Boot 3.4.x + Cloud 2024.0.x is the supported combination for current open-source support
spring-boot = "3.4.5"
spring-cloud = "2024.0.2"
spring-dependency-management = "1.1.7"

# gRPC & Protobuf (aligned for generated code)
grpc = "1.69.0"
protobuf = "4.29.3"
protobuf-plugin = "0.10.0"

# Database
postgresql = "42.7.5"
flyway = "10.21.0"

# Kafka (broker pin for docs / non-BOM uses; Spring Kafka version comes from Spring Boot BOM)
kafka = "3.9.0"

# Redis
lettuce = "6.4.2.RELEASE"

# Observability
micrometer = "1.14.5"
opentelemetry = "1.49.0"
opentelemetry-instrumentation = "2.14.0"
logstash-logback = "7.4"

# Security
jwt = "0.12.6"
nimbus-jose-jwt = "9.47"
bouncycastle = "1.79"

# Serialization (align with Spring Boot 3.4 managed Jackson where possible)
jackson = "2.18.3"

# Validation
jakarta-validation = "3.1.1"
hibernate-validator = "8.0.2.Final"

# Testing
junit = "5.11.4"
assertj = "3.27.7"
mockito = "5.14.2"
testcontainers = "1.21.4"
awaitility = "4.2.2"

# Resilience
resilience4j = "2.2.0"

# AWS SDK (for S3/MinIO)
aws-sdk = "2.29.51"

# Apache Commons (IO, Net for FTP/SFTP)
commons-io = "2.18.0"
commons-net = "3.11.1"
jsch = "0.2.21"

# Additional database drivers
mysql = "9.1.0"
mssql = "12.8.1.jre11"
oracle = "23.7.0.25.01"
mongodb = "5.3.1"

# Messaging
rabbitmq = "5.24.0"

# Utilities
guava = "33.6.0-jre"
commons-lang3 = "3.17.0"
mapstruct = "1.6.3"
lombok = "1.18.36"
slf4j = "2.0.16"

# Test data
datafaker = "2.5.4"

# API Documentation
springdoc = "2.8.8"

# Build
spotless = "6.25.0"
owasp-dependencycheck = "9.0.10"

# ============================================================================
# Libraries — single source of truth for dependency coordinates
# ============================================================================
[libraries]
# Spring Boot BOM (import in Gradle or use with platform())
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }

# Spring Boot Starters
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter", version.ref = "spring-boot" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web", version.ref = "spring-boot" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux", version.ref = "spring-boot" }
spring-boot-starter-data-jpa = { module = "org.springframework.boot:spring-boot-starter-data-jpa", version.ref = "spring-boot" }
spring-boot-starter-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis", version.ref = "spring-boot" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security", version.ref = "spring-boot" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation", version.ref = "spring-boot" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator", version.ref = "spring-boot" }
spring-boot-starter-graphql = { module = "org.springframework.boot:spring-boot-starter-graphql", version.ref = "spring-boot" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test", version.ref = "spring-boot" }

# Spring Cloud
spring-cloud-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-starter-gateway = { module = "org.springframework.cloud:spring-cloud-starter-gateway" }

# Spring Kafka (versions from Spring Boot BOM when used with spring-boot-dependencies platform)
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }

# gRPC
grpc-netty-shaded = { module = "io.grpc:grpc-netty-shaded", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
grpc-services = { module = "io.grpc:grpc-services", version.ref = "grpc" }
grpc-testing = { module = "io.grpc:grpc-testing", version.ref = "grpc" }

# Protobuf
protobuf-java = { module = "com.google.protobuf:protobuf-java", version.ref = "protobuf" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }

# Database
postgresql = { module = "org.postgresql:postgresql", version.ref = "postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core", version.ref = "flyway" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql", version.ref = "flyway" }

# Observability
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus", version.ref = "micrometer" }
opentelemetry-bom = { module = "io.opentelemetry:opentelemetry-bom", version.ref = "opentelemetry" }
opentelemetry-instrumentation-bom = { module = "io.opentelemetry.instrumentation:opentelemetry-instrumentation-bom", version.ref = "opentelemetry-instrumentation" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api" }
opentelemetry-sdk = { module = "io.opentelemetry:opentelemetry-sdk" }
opentelemetry-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }
logstash-logback-encoder = { module = "net.logstash.logback:logstash-logback-encoder", version.ref = "logstash-logback" }

# Security
jjwt-api = { module = "io.jsonwebtoken:jjwt-api", version.ref = "jwt" }
jjwt-impl = { module = "io.jsonwebtoken:jjwt-impl", version.ref = "jwt" }
jjwt-jackson = { module = "io.jsonwebtoken:jjwt-jackson", version.ref = "jwt" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus-jose-jwt" }
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcpkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }

# Resilience
resilience4j-spring-boot3 = { module = "io.github.resilience4j:resilience4j-spring-boot3", version.ref = "resilience4j" }
resilience4j-circuitbreaker = { module = "io.github.resilience4j:resilience4j-circuitbreaker", version.ref = "resilience4j" }
resilience4j-retry = { module = "io.github.resilience4j:resilience4j-retry", version.ref = "resilience4j" }
resilience4j-timelimiter = { module = "io.github.resilience4j:resilience4j-timelimiter", version.ref = "resilience4j" }
resilience4j-reactor = { module = "io.github.resilience4j:resilience4j-reactor", version.ref = "resilience4j" }

# Serialization
jackson-bom = { module = "com.fasterxml.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310" }
jackson-module-kotlin = { module = "com.fasterxml.jackson.module:jackson-module-kotlin" }

# Validation
jakarta-validation-api = { module = "jakarta.validation:jakarta.validation-api", version.ref = "jakarta-validation" }
hibernate-validator = { module = "org.hibernate.validator:hibernate-validator", version.ref = "hibernate-validator" }

# Logging (non-Spring modules)
slf4j-api = { module = "org.slf4j:slf4j-api", version.ref = "slf4j" }

# Testing
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-jupiter-api = { module = "org.junit.jupiter:junit-jupiter-api" }
junit-jupiter-params = { module = "org.junit.jupiter:junit-jupiter-params" }
assertj-core = { module = "org.assertj:assertj-core", version.ref = "assertj" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }
mockito-junit-jupiter = { module = "org.mockito:mockito-junit-jupiter", version.ref = "mockito" }
testcontainers-bom = { module = "org.testcontainers:testcontainers-bom", version.ref = "testcontainers" }
testcontainers-junit-jupiter = { module = "org.testcontainers:junit-jupiter" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-kafka = { module = "org.testcontainers:kafka" }
awaitility = { module = "org.awaitility:awaitility", version.ref = "awaitility" }

# Utilities
guava = { module = "com.google.guava:guava", version.ref = "guava" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
mapstruct = { module = "org.mapstruct:mapstruct", version.ref = "mapstruct" }
mapstruct-processor = { module = "org.mapstruct:mapstruct-processor", version.ref = "mapstruct" }
lombok = { module = "org.projectlombok:lombok", version.ref = "lombok" }

# Annotation processing
javax-annotation-api = { module = "javax.annotation:javax.annotation-api", version = "1.3.2" }

# AWS SDK (S3/MinIO)
aws-s3 = { module = "software.amazon.awssdk:s3", version.ref = "aws-sdk" }
aws-s3-transfer-manager = { module = "software.amazon.awssdk:s3-transfer-manager", version.ref = "aws-sdk" }
aws-sts = { module = "software.amazon.awssdk:sts", version.ref = "aws-sdk" }

# Apache Commons (IO, Net)
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
commons-net = { module = "commons-net:commons-net", version.ref = "commons-net" }
jsch = { module = "com.github.mwiede:jsch", version.ref = "jsch" }

# Messaging
amqp-client = { module = "com.rabbitmq:amqp-client", version.ref = "rabbitmq" }

# Additional database drivers
mysql-connector = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }
mssql-jdbc = { module = "com.microsoft.sqlserver:mssql-jdbc", version.ref = "mssql" }
oracle-jdbc = { module = "com.oracle.database.jdbc:ojdbc11", version.ref = "oracle" }
mongodb-driver = { module = "org.mongodb:mongodb-driver-sync", version.ref = "mongodb" }

# Test data
datafaker = { module = "net.datafaker:datafaker", version.ref = "datafaker" }

# API Documentation
springdoc-openapi-starter-webmvc-ui = { module = "org.springdoc:springdoc-openapi-starter-webmvc-ui", version.ref = "springdoc" }
springdoc-openapi-starter-webflux-ui = { module = "org.springdoc:springdoc-openapi-starter-webflux-ui", version.ref = "springdoc" }

# buildSrc — Gradle plugin classpath (same versions as [plugins] below)
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spring-dependency-management-gradle-plugin = { module = "io.spring.gradle:dependency-management-plugin", version.ref = "spring-dependency-management" }
protobuf-gradle-plugin = { module = "com.google.protobuf:protobuf-gradle-plugin", version.ref = "protobuf-plugin" }

# ============================================================================
# Bundles
# ============================================================================
[bundles]
grpc = ["grpc-netty-shaded", "grpc-protobuf", "grpc-stub", "grpc-services"]
grpc-test = ["grpc-testing"]
jwt = ["jjwt-api", "jjwt-impl", "jjwt-jackson"]
jackson = ["jackson-databind", "jackson-datatype-jsr310"]
flyway = ["flyway-core", "flyway-postgresql"]
testcontainers = ["testcontainers-junit-jupiter", "testcontainers-postgresql", "testcontainers-kafka"]
testing = ["junit-jupiter", "assertj-core", "mockito-junit-jupiter", "awaitility"]

# ============================================================================
# Plugins
# ============================================================================
[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
owasp-dependencycheck = { id = "org.owasp.dependencycheck", version.ref = "owasp-dependencycheck" }
