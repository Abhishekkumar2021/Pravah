spring:
  application:
    name: gateway
  autoconfigure:
    exclude:
      - org.springframework.cloud.gateway.config.GatewayRedisAutoConfiguration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${PRAVAH_JWKS_URL:http://localhost:8082/.well-known/jwks.json}

  cloud:
    gateway:
      default-filters:
        - name: CircuitBreaker
          args:
            name: defaultCircuitBreaker
            fallbackUri: forward:/fallback
      routes:
        - id: graphql-service
          uri: lb://graphql-service
          predicates:
            - Path=/graphql/**
        
        # US-03.08: pipeline runs are owned by execution-service (must precede pipeline-service).
        - id: execution-service-pipeline-runs
          uri: lb://execution-service
          predicates:
            - Path=/api/v1/pipelines/*/runs

        - id: pipeline-service
          uri: lb://pipeline-service
          predicates:
            - Path=/api/v1/pipelines/**,/api/v1/connections/**
        
        - id: execution-service
          uri: lb://execution-service
          predicates:
            - Path=/api/v1/runs/**,/api/v1/jobs/**,/api/v1/executions/**,/api/v1/artifacts/**

        - id: runner-service
          uri: lb://runner-service
          predicates:
            - Path=/api/v1/runners/**

        - id: connect-service
          uri: lb://connect-service
          predicates:
            - Path=/api/v1/connectors/**

        # Native WebSocket upgrade (US-12.10); requires compatible load-balancer timeouts in prod.
        - id: execution-service-ws
          uri: lb://execution-service
          predicates:
            - Path=/ws/**

        - id: scheduler-service
          uri: lb://scheduler-service
          predicates:
            - Path=/api/v1/schedules/**,/api/v1/triggers/**,/api/v1/hooks/**

        - id: tenant-service
          uri: lb://tenant-service
          predicates:
            - Path=/api/v1/tenants/**,/api/v1/users/**,/api/v1/auth/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/alert-rules/**,/api/v1/notifications/**,/api/v1/notification-preferences/**,/api/v1/audit-logs/**

server:
  port: 8080

pravah:
  ratelimit:
    enabled: ${PRAVAH_RATE_LIMIT_ENABLED:true}
    default-requests-per-second: ${PRAVAH_RATE_LIMIT_RPS:100}
    default-burst-capacity: ${PRAVAH_RATE_LIMIT_BURST:200}
    api-token-requests-per-second: ${PRAVAH_RATE_LIMIT_API_TOKEN_RPS:50}
    api-token-burst-capacity: ${PRAVAH_RATE_LIMIT_API_TOKEN_BURST:100}
    fail-open: ${PRAVAH_RATE_LIMIT_FAIL_OPEN:true}

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallRateThreshold: 80
        slowCallDurationThreshold: 5s
    instances:
      pipeline-service:
        baseConfig: default
      execution-service:
        baseConfig: default
      scheduler-service:
        baseConfig: default
      tenant-service:
        baseConfig: default
      notification-service:
        baseConfig: default
      runner-service:
        baseConfig: default
      connect-service:
        baseConfig: default
  timelimiter:
    configs:
      default:
        timeoutDuration: 30s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers,circuitbreakerevents
  endpoint:
    health:
      show-details: when_authorized
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    io.pravah: INFO
    org.springframework.cloud.gateway: DEBUG
    io.github.resilience4j: INFO
