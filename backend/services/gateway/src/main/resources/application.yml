spring:
  application:
    name: gateway
  
  cloud:
    gateway:
      routes:
        - id: graphql-service
          uri: lb://graphql-service
          predicates:
            - Path=/graphql/**
        
        # US-03.08: pipeline runs are owned by execution-service (must precede pipeline-service).
        - id: execution-service-pipeline-runs
          uri: lb://execution-service
          predicates:
            - Path=/api/v1/pipelines/*/runs

        - id: pipeline-service
          uri: lb://pipeline-service
          predicates:
            - Path=/api/v1/pipelines/**,/api/v1/connections/**
        
        - id: execution-service
          uri: lb://execution-service
          predicates:
            - Path=/api/v1/runs/**,/api/v1/jobs/**,/api/v1/executions/**

        # Native WebSocket upgrade (US-12.10); requires compatible load-balancer timeouts in prod.
        - id: execution-service-ws
          uri: lb://execution-service
          predicates:
            - Path=/ws/**

        - id: scheduler-service
          uri: lb://scheduler-service
          predicates:
            - Path=/api/v1/schedules/**,/api/v1/triggers/**,/api/v1/hooks/**

        - id: tenant-service
          uri: lb://tenant-service
          predicates:
            - Path=/api/v1/tenants/**,/api/v1/users/**,/api/v1/auth/**

        - id: notification-service
          uri: lb://notification-service
          predicates:
            - Path=/api/v1/alert-rules/**,/api/v1/notifications/**,/api/v1/notification-preferences/**,/api/v1/audit-logs/**

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    io.pravah: INFO
    org.springframework.cloud.gateway: DEBUG
