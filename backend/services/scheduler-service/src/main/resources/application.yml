spring:
  application:
    name: scheduler-service

  datasource:
    url: jdbc:postgresql://localhost:5432/pravah_scheduler
    username: ${DB_USERNAME:pravah}
    password: ${DB_PASSWORD:pravah}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    consumer:
      group-id: scheduler-service-triggers
      auto-offset-reset: earliest

server:
  port: 8085

pravah:
  security:
    jwt:
      jwks-url: ${PRAVAH_JWKS_URL:http://localhost:8082/.well-known/jwks.json}
  internal-service:
    secret: ${PRAVAH_INTERNAL_SERVICE_SECRET:pravah-local-internal-secret}
  execution-service:
    base-url: ${EXECUTION_SERVICE_BASE_URL:http://localhost:8084}
  scheduler:
    evaluation-interval-ms: ${PRAVAH_SCHEDULER_EVALUATION_INTERVAL_MS:60000}
    leader-lock-ttl-seconds: ${PRAVAH_SCHEDULER_LEADER_LOCK_TTL_SECONDS:90}
  hooks:
    base-url: ${PRAVAH_HOOKS_BASE_URL:http://localhost:8080/api/v1/hooks}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

logging:
  level:
    io.pravah: INFO
