spring:
  application:
    name: tenant-service

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false
  
  datasource:
    url: jdbc:postgresql://localhost:5432/pravah_tenant
    username: ${DB_USERNAME:pravah}
    password: ${DB_PASSWORD:pravah}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: public
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
  
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: 8082

# JWT Configuration (for local development only - use environment variables in production)
pravah:
  auth:
    max-failed-attempts: 5
    lock-duration: 15m
    registration-tenant-id: ${PRAVAH_DEV_TENANT_ID:11111111-1111-4111-8111-111111111111}
    password-reset-token-ttl: 1h
    email-verification-token-ttl: 24h
    frontend-base-url: ${PRAVAH_FRONTEND_URL:http://localhost:5173}
    mail-from: ${PRAVAH_MAIL_FROM:noreply@localhost.pravah}
  security:
    jwt:
      issuer: ${PRAVAH_JWT_ISSUER:pravah-dev}
      jwks-url: ${PRAVAH_JWKS_URL:http://localhost:8082/.well-known/jwks.json}
  cache:
    enabled: ${PRAVAH_CACHE_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# Logging configuration is in logback-spring.xml
# - Local profile: human-readable console logs
# - Production profile: JSON structured logs (via logstash-logback-encoder)
# MDC keys automatically added: tenant_id, user_id, request_id, trace_id, span_id
