# Aligned with .github/workflows/cli-ci.yml (golangci-lint v1.57)
run:
  timeout: 5m
  tests: true
  # Match cli-ci.yml and GOTOOLCHAIN in scripts/ci-cli.sh
  go: "1.22"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused

linters-settings:
  errcheck:
    check-type-assertions: true

issues:
  exclude-use-default: false
  max-issues-per-linter: 0
  max-same-issues: 0
